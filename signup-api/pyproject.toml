[project]
name = "signup-api"
version = "0.1.0"
description = "Public signup API: verifies a dispatcher's phone and queues their firm for provisioning"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pymongo>=4.10,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "mongomock>=4.3,<5",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-p no:cacheprovider"
# mongomock (test double only) still calls datetime.utcnow internally.
filterwarnings = ["ignore:datetime.datetime.utcnow:DeprecationWarning:mongomock"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
extraPaths = [".", "tests"]
