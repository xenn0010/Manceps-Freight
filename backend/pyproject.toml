[project]
name = "manceps-platform"
version = "0.1.0"
description = "Manceps platform backend: multi-tenant API, core domain logic and background worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "pymongo>=4.10,<5",
    "PyJWT[crypto]>=2.9,<3",
    "structlog>=24.1,<26",
    "openpyxl>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
manceps-api = "manceps_api.serve:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "mongomock>=4.3,<5",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "httpx>=0.27,<1",
    # starlette>=1.x TestClient prefers httpx2 and deprecates plain httpx.
    "httpx2>=2.16,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manceps_core", "manceps_api", "manceps_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = [
    "error",
    # mongomock (test double only) still calls datetime.utcnow internally.
    "ignore:datetime.datetime.utcnow:DeprecationWarning:mongomock.*",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["manceps_core", "manceps_api", "manceps_worker", "scripts", "tests"]
extraPaths = ["tests"]
venvPath = "."
venv = ".venv"
